<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" font-family="Poppins, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F66A8" flood-opacity="0.18"/>
    </filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#0F66A8" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background shapes -->
  <circle cx="300" cy="250" r="215" fill="#EAF3FC"/>
  <circle cx="300" cy="250" r="235" fill="none" stroke="#BBD7F3" stroke-width="2"/>
  <rect x="440" y="385" width="112" height="80" fill="url(#dots)"/>
  <circle cx="525" cy="62" r="12" fill="#6AA9E6"/>
  <circle cx="62" cy="438" r="22" fill="#9CC7F0" opacity="0.7"/>
  <circle cx="548" cy="250" r="7" fill="#F5A623"/>

  <!-- Main dashboard window -->
  <g filter="url(#sh)">
    <rect x="100" y="115" width="380" height="270" rx="16" fill="#FFFFFF"/>
  </g>
  <path d="M100 145V131a16 16 0 0 1 16-16H464a16 16 0 0 1 16 16V145Z" fill="#0F66A8"/>
  <circle cx="118" cy="130" r="4" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="134" cy="130" r="4" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="150" cy="130" r="4" fill="#F5A623"/>

  <!-- Sidebar -->
  <path d="M100 145H176V385H116a16 16 0 0 1-16-16Z" fill="#F1F7FD"/>
  <rect x="112" y="162" width="52" height="10" rx="5" fill="#0F66A8"/>
  <rect x="112" y="186" width="44" height="10" rx="5" fill="#CFE1F5"/>
  <rect x="112" y="210" width="50" height="10" rx="5" fill="#CFE1F5"/>
  <rect x="112" y="234" width="40" height="10" rx="5" fill="#CFE1F5"/>

  <!-- Stat cards -->
  <rect x="190" y="160" width="84" height="50" rx="10" fill="#F1F7FD"/>
  <text x="202" y="185" font-size="16" font-weight="700" fill="#1F2A44">12</text>
  <text x="202" y="200" font-size="8" fill="#6B7A90">Projects</text>

  <rect x="287" y="160" width="84" height="50" rx="10" fill="#F1F7FD"/>
  <text x="299" y="185" font-size="16" font-weight="700" fill="#1F2A44">48</text>
  <text x="299" y="200" font-size="8" fill="#6B7A90">Tasks</text>

  <rect x="384" y="160" width="84" height="50" rx="10" fill="#F1F7FD"/>
  <text x="396" y="185" font-size="16" font-weight="700" fill="#1F2A44">5</text>
  <text x="396" y="200" font-size="8" fill="#6B7A90">Open tickets</text>

  <!-- Bar chart card -->
  <rect x="190" y="224" width="180" height="150" rx="10" fill="#FFFFFF" stroke="#E1ECF7"/>
  <text x="202" y="244" font-size="9" font-weight="600" fill="#1F2A44">Monthly progress</text>
  <line x1="200" y1="360" x2="360" y2="360" stroke="#E1ECF7"/>
  <rect x="206" y="330" width="16" height="30" rx="3" fill="#9CC7F0"/>
  <rect x="232" y="310" width="16" height="50" rx="3" fill="#9CC7F0"/>
  <rect x="258" y="320" width="16" height="40" rx="3" fill="#9CC7F0"/>
  <rect x="284" y="290" width="16" height="70" rx="3" fill="#6AA9E6"/>
  <rect x="310" y="300" width="16" height="60" rx="3" fill="#6AA9E6"/>
  <rect x="336" y="270" width="16" height="90" rx="3" fill="#0F66A8"/>

  <!-- Completion donut card -->
  <rect x="382" y="224" width="86" height="150" rx="10" fill="#FFFFFF" stroke="#E1ECF7"/>
  <text x="425" y="244" font-size="9" font-weight="600" fill="#1F2A44" text-anchor="middle">Completion</text>
  <circle cx="425" cy="295" r="26" fill="none" stroke="#E1ECF7" stroke-width="9"/>
  <circle cx="425" cy="295" r="26" fill="none" stroke="#0F66A8" stroke-width="9" stroke-linecap="round" stroke-dasharray="122.5 163.4" transform="rotate(-90 425 295)"/>
  <text x="425" y="299" font-size="11" font-weight="700" fill="#1F2A44" text-anchor="middle">75%</text>
  <text x="425" y="345" font-size="8" fill="#6B7A90" text-anchor="middle">Projects on track</text>

  <!-- Floating card: ticket resolved -->
  <g filter="url(#sh)">
    <rect x="395" y="60" width="150" height="62" rx="12" fill="#FFFFFF"/>
  </g>
  <circle cx="420" cy="91" r="14" fill="#E3F6EA"/>
  <path d="M413 91l5 5 9-10" fill="none" stroke="#2FA866" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="442" y="87" font-size="10" font-weight="600" fill="#1F2A44">Ticket resolved</text>
  <text x="442" y="102" font-size="8" fill="#6B7A90">Support team</text>

  <!-- Floating card: invoice -->
  <g filter="url(#sh)">
    <rect x="40" y="335" width="160" height="66" rx="12" fill="#FFFFFF"/>
  </g>
  <text x="56" y="360" font-size="10" font-weight="600" fill="#1F2A44">Invoice #1024</text>
  <text x="184" y="362" font-size="11" font-weight="700" fill="#0F66A8" text-anchor="end">$1,200</text>
  <rect x="56" y="370" width="46" height="16" rx="8" fill="#E3F6EA"/>
  <text x="79" y="382" font-size="9" font-weight="600" fill="#2FA866" text-anchor="middle">Paid</text>

  <!-- Floating badge: code -->
  <g filter="url(#sh)">
    <circle cx="70" cy="150" r="26" fill="#FFFFFF"/>
  </g>
  <text x="70" y="156" font-size="16" font-weight="700" fill="#F5A623" text-anchor="middle">&lt;/&gt;</text>

  <!-- Floating chat bubble -->
  <rect x="470" y="300" width="84" height="40" rx="12" fill="#0F66A8"/>
  <path d="M490 340l-6 12 16-12Z" fill="#0F66A8"/>
  <text x="512" y="324" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">New task</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
